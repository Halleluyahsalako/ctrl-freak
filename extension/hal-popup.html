<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ctrl+Freak</title>
    <style>
      body {
        margin: 0;
        width: 320px;
        min-height: 200px;
        background: #12131c;
        color: #e9e9f0;
        font-family: ui-monospace, "IBM Plex Mono", monospace;
      }
      .hal-popup {
        padding: 1rem;
      }
      .hal-title {
        font-size: 1rem;
        margin: 0 0 0.75rem;
        color: #d99b47;
      }
      .hal-empty {
        color: #9a9cb3;
        font-size: 0.85rem;
      }
      .hal-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .hal-button {
        width: 100%;
        margin: 0.5rem 0 0.75rem;
        padding: 0.5rem;
        background: #d99b47;
        color: #12131c;
        border: none;
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .hal-button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .hal-link {
        background: none;
        border: none;
        color: #6cbcc4;
        font-family: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .hal-error {
        color: #e5645c;
        font-size: 0.8rem;
      }
      .hal-clip-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .hal-clip-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem;
        border-bottom: 1px solid #2a2c3d;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .hal-clip-item:hover {
        background: #191b27;
      }
      .hal-clip-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hal-pin {
        background: none;
        border: 1px solid #2a2c3d;
        color: #6b6d84;
        border-radius: 3px;
        width: 20px;
        height: 20px;
        line-height: 1;
        flex-shrink: 0;
        cursor: pointer;
      }
      .hal-pinned {
        color: #d99b47;
        border-color: #d99b47;
      }
    </style>
  </head>
  <body>
    <div id="hal-root"></div>
    <script type="module" src="/src/hal-popup.tsx"></script>
  </body>
</html>
