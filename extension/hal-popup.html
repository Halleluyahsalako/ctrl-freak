<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ctrl+Freak</title>
    <link rel="stylesheet" href="/src/hal-tokens.css" />
    <style>
      body {
        width: 360px;
        min-height: 220px;
      }
      .hal-popup-frame {
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-float);
        overflow: hidden;
      }

      /* ---- sign-in gate ---- */
      .hal-signin {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px var(--sp-16);
        gap: var(--sp-11);
      }
      .hal-wordmark {
        font-family: var(--font-mono);
        font-size: 15px;
        font-weight: 500;
      }
      .hal-wordmark .hal-accent-part {
        color: var(--accent);
      }
      .hal-tagline {
        font-family: var(--font-sans);
        font-size: 13px;
        color: var(--ink-muted);
        text-align: center;
        margin: 0;
      }
      .hal-google-btn {
        width: 100%;
        height: 36px;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius-sm);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--sp-8);
        cursor: pointer;
        transition: background 120ms var(--ease);
      }
      .hal-google-btn:hover {
        background: var(--surface-raised);
      }
      .hal-helper-error {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--danger);
        margin: 0;
      }

      /* ---- top bar ---- */
      .hal-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 13px;
        border-bottom: 1px solid var(--rule);
      }
      .hal-status {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-faint);
      }
      .hal-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-faint);
      }
      .hal-status-dot.hal-online {
        background: var(--cyan);
      }
      .hal-notes-link {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        color: var(--ink-faint);
        text-decoration: none;
        cursor: pointer;
        background: none;
        border: none;
        font-family: var(--font-mono);
        font-size: 11px;
      }
      .hal-notes-link:hover {
        color: var(--ink-muted);
      }

      /* ---- body ---- */
      .hal-popup-body {
        padding: 11px 13px;
      }
      .hal-sync-btn {
        width: 100%;
        height: 38px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: var(--bg);
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--sp-6);
        cursor: pointer;
        transition: filter 120ms var(--ease), transform 60ms var(--ease);
      }
      .hal-sync-btn:hover:not(:disabled) {
        filter: brightness(1.06);
      }
      .hal-sync-btn:active:not(:disabled) {
        transform: translateY(1px);
      }
      .hal-sync-btn:disabled {
        background: color-mix(in srgb, var(--accent) 40%, transparent);
        color: color-mix(in srgb, var(--bg) 60%, transparent);
        cursor: default;
      }
      .hal-toolbar-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 5px 0 var(--sp-9);
      }
      .hal-count-label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-faint);
        margin: 0;
      }
      .hal-toolbar-actions {
        display: flex;
        align-items: center;
        gap: var(--sp-11);
      }
      .hal-text-btn {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-faint);
        transition: color 120ms var(--ease);
      }
      .hal-text-btn:hover {
        color: var(--ink-muted);
      }
      .hal-text-btn.hal-text-btn-danger:hover {
        color: var(--danger);
      }
      .hal-text-btn:disabled {
        color: var(--ink-faint);
        opacity: 0.4;
        cursor: default;
      }

      /* ---- select mode ---- */
      .hal-select-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius-sm);
        padding: var(--sp-8) var(--sp-9);
        margin-bottom: var(--sp-9);
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-muted);
      }
      .hal-select-bar-actions {
        display: flex;
        align-items: center;
        gap: var(--sp-11);
      }
      .hal-checkbox {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid var(--rule);
        background: var(--inset);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--bg);
        transition: background 120ms var(--ease), border-color 120ms var(--ease);
      }
      .hal-checkbox.hal-checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .hal-clip-card.hal-select-mode {
        display: flex;
        align-items: flex-start;
        gap: var(--sp-8);
      }
      .hal-clip-card.hal-select-mode .hal-clip-body {
        flex: 1;
        min-width: 0;
      }

      /* ---- dialog ---- */
      .hal-dialog-scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .hal-dialog {
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-float);
        padding: var(--sp-16);
        width: 280px;
      }
      .hal-dialog-title {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--ink);
        margin: 0 0 8px;
      }
      .hal-dialog-body {
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--ink-muted);
        margin: 0 0 16px;
      }
      .hal-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .hal-dialog-btn {
        height: 30px;
        padding: 0 12px;
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 11px;
        cursor: pointer;
        background: transparent;
      }
      .hal-dialog-btn-cancel {
        border: 1px solid var(--rule);
        color: var(--ink-muted);
      }
      .hal-dialog-btn-cancel:hover {
        background: var(--surface-raised);
      }
      .hal-dialog-btn-danger {
        border: 1px solid var(--danger);
        color: var(--danger);
      }
      .hal-dialog-btn-danger:hover {
        background: var(--danger);
        color: var(--bg);
      }

      /* ---- feed ---- */
      .hal-feed {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: var(--sp-8);
        max-height: 360px;
        overflow-y: auto;
      }
      .hal-clip-card {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius-card);
        padding: 9px 10px;
        cursor: pointer;
        transition: background 120ms var(--ease);
      }
      .hal-clip-card:hover {
        background: var(--surface-raised);
      }
      .hal-clip-card.hal-pinned-card {
        border-color: var(--accent);
      }
      .hal-clip-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--sp-8);
      }
      .hal-clip-text {
        font-family: var(--font-sans);
        font-size: 13px;
        color: var(--ink);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: break-word;
      }
      .hal-clip-text.hal-code-like {
        font-family: var(--font-mono);
        font-size: 12px;
        -webkit-line-clamp: 1;
      }
      .hal-clip-image-row {
        display: flex;
        align-items: center;
        gap: var(--sp-8);
      }
      .hal-thumb-well {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        background: var(--inset);
        border: 1px solid var(--rule);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cyan);
        overflow: hidden;
      }
      .hal-thumb-well img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hal-pin-btn {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: var(--radius-sm);
        border: none;
        background: none;
        color: var(--ink-faint);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 120ms var(--ease);
      }
      .hal-pin-btn:hover {
        color: var(--ink-muted);
      }
      .hal-pin-btn.hal-pinned {
        color: var(--accent);
      }
      .hal-pin-btn.hal-pinned:hover {
        color: var(--accent);
      }
      .hal-clip-meta {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: var(--sp-6);
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-faint);
      }

      /* ---- empty state ---- */
      .hal-empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 30px var(--sp-16);
        gap: 4px;
      }
      .hal-empty-well {
        width: 40px;
        height: 40px;
        background: var(--surface);
        border-radius: var(--radius-card);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        margin-bottom: var(--sp-8);
      }
      .hal-empty-title {
        font-family: var(--font-sans);
        font-size: 13px;
        color: var(--ink);
        margin: 0;
      }
      .hal-empty-body {
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--ink-muted);
        margin: 0;
      }

      /* ---- toast ---- */
      .hal-toast {
        position: fixed;
        left: 13px;
        right: 13px;
        top: 46px;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-float);
        padding: var(--sp-8) var(--sp-9);
        font-family: var(--font-sans);
        font-size: 13px;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: var(--sp-6);
        animation: hal-toast-in 120ms var(--ease);
      }
      .hal-toast-icon {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        flex-shrink: 0;
      }
      .hal-toast-success .hal-toast-icon {
        color: var(--accent);
      }
      .hal-toast-error .hal-toast-icon {
        color: var(--danger);
      }
      .hal-toast-neutral .hal-toast-icon {
        color: var(--ink-muted);
      }
      @keyframes hal-toast-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="hal-root" class="hal-popup-frame"></div>
    <script type="module" src="/src/hal-popup.tsx"></script>
  </body>
</html>
