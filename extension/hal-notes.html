<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ctrl+Freak — Notes</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #12131c;
        color: #e9e9f0;
        font-family: ui-monospace, "IBM Plex Mono", monospace;
      }
      .hal-notes-app {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }
      .hal-sidebar {
        border-right: 1px solid #2a2c3d;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .hal-title {
        font-size: 1rem;
        margin: 0 0 0.5rem;
        color: #d99b47;
      }
      .hal-category-list,
      .hal-note-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .hal-category-item,
      .hal-note-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.4rem 0.5rem;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .hal-category-item:hover,
      .hal-note-item:hover {
        background: #191b27;
      }
      .hal-active {
        background: #191b27;
        color: #d99b47;
      }
      .hal-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 0.4rem;
      }
      .hal-new-category {
        display: flex;
        gap: 0.4rem;
        margin: 0.5rem 0;
      }
      .hal-input {
        background: #0d0e16;
        border: 1px solid #2a2c3d;
        color: #e9e9f0;
        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        font-family: inherit;
        font-size: 0.85rem;
        width: 100%;
      }
      .hal-button {
        padding: 0.5rem;
        background: #d99b47;
        color: #12131c;
        border: none;
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .hal-button-small {
        padding: 0.4rem 0.6rem;
        flex-shrink: 0;
      }
      .hal-error {
        color: #e5645c;
        font-size: 0.8rem;
        margin: 0 0 0.5rem;
      }
      .hal-button-danger {
        background: #e5645c;
      }
      .hal-link {
        background: none;
        border: none;
        color: #6cbcc4;
        cursor: pointer;
        font-family: inherit;
      }
      .hal-editor {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 640px;
      }
      .hal-note-title {
        font-size: 1.1rem;
      }
      .hal-note-body {
        min-height: 320px;
        resize: vertical;
      }
      .hal-editor-actions {
        display: flex;
        gap: 0.5rem;
      }
      .hal-toolbar {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .hal-toolbar-btn {
        background: #0d0e16;
        border: 1px solid #2a2c3d;
        color: #e9e9f0;
        border-radius: 4px;
        width: 28px;
        height: 28px;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .hal-toolbar-btn.hal-active {
        border-color: #d99b47;
        color: #d99b47;
      }
      .hal-toolbar-btn-right {
        margin-left: auto;
        width: auto;
        padding: 0 0.6rem;
      }
      .hal-file-input {
        display: none;
      }
      .hal-note-preview {
        min-height: 320px;
        background: #0d0e16;
        border: 1px solid #2a2c3d;
        border-radius: 4px;
        padding: 0.75rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.9rem;
        line-height: 1.6;
        overflow-wrap: break-word;
      }
      .hal-note-preview :first-child {
        margin-top: 0;
      }
      .hal-uploading {
        color: #9a9cb3;
        font-size: 0.8rem;
        margin: 0;
      }
      .hal-attachment-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .hal-attachment-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.5rem;
        background: #0d0e16;
        border: 1px solid #2a2c3d;
        border-radius: 4px;
        font-size: 0.8rem;
      }
      .hal-attachment-thumb {
        width: 28px;
        height: 28px;
        object-fit: cover;
        border-radius: 3px;
      }
      .hal-attachment-icon {
        width: 28px;
        text-align: center;
      }
      .hal-attachment-name {
        flex: 1;
        cursor: pointer;
        color: #6cbcc4;
      }
    </style>
  </head>
  <body>
    <div id="hal-root"></div>
    <script type="module" src="/src/hal-notes.tsx"></script>
  </body>
</html>
